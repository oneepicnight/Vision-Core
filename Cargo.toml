[package]
name        = "vision-core"
version     = "1.0.4"
edition     = "2021"
description = "Vision blockchain — minimal stable core node"

[[bin]]
name = "vision-core"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
bincode     = "1"

# Hashing / crypto
blake3 = "1"
hex    = "0.4"
ed25519-dalek = "2"

# Storage
sled = "0.34"

# HTTP API
axum = "0.7"

# Data structures
indexmap   = { version = "2", features = ["serde"] }
once_cell  = "1"

# Networking
tokio-util = { version = "0.7", features = ["codec"] }

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
anyhow = "1"
toml   = "0.8"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
