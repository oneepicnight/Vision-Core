name: Vision-Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Blocking cargo check
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install declared Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2

      - name: Check all targets with the lockfile
        run: cargo check --all-targets --locked

  release-tests:
    name: Blocking single-threaded release suite
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install declared Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2

      - name: Run authoritative release validation
        run: cargo test --release --locked -- --test-threads=1

  formatting-debt:
    name: Formatting debt report (non-blocking until Tranche 2)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install declared Rust toolchain
        run: rustup show active-toolchain

      - name: Report current formatting debt without modifying files
        run: cargo fmt --all -- --check

  clippy-debt:
    name: Clippy debt report (non-blocking until Tranche 2)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install declared Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2

      - name: Report current Clippy debt without applying fixes
        run: cargo clippy --all-targets --locked
